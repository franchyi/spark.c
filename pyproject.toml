[project]
name = "sparkserve"
version = "0.1.0"
description = "Python tooling for the Rust/CUDA SparkServe inference runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SparkServe contributors" }]
dependencies = []

[project.scripts]
sparkserve = "sparkserve.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
