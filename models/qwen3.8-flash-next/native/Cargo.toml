[package]
name = "spark-flash-next"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Minimal Rust control plane for Qwen3.8-Flash-Next on DGX Spark"

[[example]]
name = "qwen_expert_cache_smoke"
path = "examples/qwen_expert_cache_smoke.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_real_moe_smoke"
path = "examples/qwen_real_moe_smoke.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_real_gdn_smoke"
path = "examples/qwen_real_gdn_smoke.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_real_qsa_smoke"
path = "examples/qwen_real_qsa_smoke.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_real_ple_smoke"
path = "examples/qwen_real_ple_smoke.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_first_token"
path = "examples/qwen_first_token.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_decode"
path = "examples/qwen_decode.rs"
required-features = ["native-fabric-smoke"]

[[example]]
name = "qwen_serve"
path = "examples/qwen_serve.rs"
required-features = ["native-fabric-smoke"]

[features]
native-fabric = []
native-fabric-smoke = ["native-fabric"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Hugging Face's Apache-2.0 Rust implementation preserves the checkpoint's
# byte-level BPE, added-token, and Oniguruma regex semantics without Python.
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
# tiny_http is a small MIT/Apache-2.0 transport. Spark.C retains all request,
# scheduling, streaming-token, and admission semantics above this layer.
tiny_http = "=0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned to the versions used by SGLang storage donor e14d1c3.
io-uring = "=0.7.14"
libc = "=0.2.189"
