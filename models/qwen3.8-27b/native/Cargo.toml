[package]
name = "spark-qwen27"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Lightweight model-specific Qwen3.8-27B control plane for DGX Spark"

[[bin]]
name = "q27-inspect"
path = "src/main.rs"

[[bin]]
name = "q27-map-inspect"
path = "src/map_main.rs"

[[bin]]
name = "q27-pack-scales"
path = "src/scale_pack.rs"

[[bin]]
name = "q27-inspect-scales"
path = "src/scale_inspect.rs"

[[bin]]
name = "q27-eager"
path = "src/eager.rs"

[[bin]]
name = "q27-serve"
path = "src/serve.rs"

[[bin]]
name = "q27-consume-equivalence"
path = "src/consume_equivalence.rs"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Exact Qwen byte-level BPE and added-token semantics, without Python.
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
# Small HTTP/1.1 transport; scheduling and generation stay model-specific.
tiny_http = "=0.12.0"
